plan-build:
    - scout
    - planner
    - refiner
    - implementer
    - reviewer
    - validator
    - shipper

soft-plan-build:
    - scout
    - roadmapper
    - planner
    - refiner
    - implementer
    - reviewer
    - shipper

# For work too large for one plan: cuts a big spec into milestones and writes
# roadmap.md at the project root. Run this ONCE, then run `spec` per milestone —
# the planner reads roadmap.md and scopes itself to the first unchecked one.
roadmap:
    - scout
    - roadmapper

spec:
    - scout
    - planner
    - refiner

# Resumes from an existing .agent/plan.md (e.g. after a `spec` run, or to retry a
# failed implementation): no planner, so the saved plan is kept and the implementer
# continues from the first unfinished phase in .agent/progress.md.
build:
    - implementer
    - reviewer
    - validator
    - shipper
