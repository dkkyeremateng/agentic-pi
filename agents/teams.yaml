# Like plan-build, but a scout runs first and shares one codebase recon with the
# planner, refiner, and implementer — so they don't each re-read the codebase.
plan-build-scout:
    - scout
    - planner
    - refiner
    - implementer
    - reviewer
    - validator

building:
