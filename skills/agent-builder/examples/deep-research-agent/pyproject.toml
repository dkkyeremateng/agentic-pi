[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A TUI-based deep research agent: a self-contained multi-agent delegation engine (Orchestrator -> Searcher -> Analyzer) on LangGraph with run-folder isolation, quotas, and provider-agnostic LLM support"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "textual>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
deep-research-agent = "deep_research_agent.app:main"
deep-research-agent-eval = "deep_research_agent.evals.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
