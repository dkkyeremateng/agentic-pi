# Verification for the AI agent factory.
#
# These are the ONLY commands the factory may run to check a change it
# proposes. The list is an allowlist matched exactly and it fails closed:
# a command that is not here is not run, and an empty list verifies nothing.
#
# This file was proposed automatically from what the repository contains.
# It belongs to this repository now — edit it freely.

commands:
  # because package.json#scripts.typecheck is present
  - "npm run typecheck"
  # because package.json#scripts.test is present
  - "npm test"
  # The two above cover the Node side ONLY. obs/ui is the browser dashboard: the
  # root test glob does not reach its tests and the root tsconfig excludes it, so
  # without the three below a change to the dashboard is verified by nothing.
  # They need no extra install — obs/ui is an npm workspace, so the root install
  # that happens before the sandbox is sealed already provides its dependencies.
  - "npm run typecheck --workspace obs/ui"
  - "npm test --workspace obs/ui"
  # The server serves the BUILD, not the sources, so a change that breaks the
  # build is a change that never reaches the running dashboard.
  - "npm run build --workspace obs/ui"

# The whole run is bounded. A suite that exceeds this fails the job
# rather than running until something else stops it.
timeout_seconds: 900
memory_mb: 2048

# Verification runs with no route to the internet except the factory's own
# model proxy. Dependencies are fetched before the sandbox is sealed.
network: proxy-only
