# OpenAPI spec for the agent-observability API (obs-server /api/*).
# Served live at GET /api/openapi.yaml; human docs in API.md.
# 3.0.3 for the widest tooling compatibility (Swagger UI, codegen, Postman).
openapi: 3.0.3
info:
  title: pi Agent Observability API
  description: >
    Local-first observability for pi agent workflows. The obs-server tails a
    JSONL event sink that every agent process appends to, indexes it by run,
    and exposes this read-mostly API for external UIs and integrations. CORS
    is open (`*`, `Allow-Headers: content-type, authorization`) because the
    server binds to 127.0.0.1 only; but since CORS never stops a request from
    reaching the server, in the OPEN (no-token) mode cross-origin browser
    requests whose `Origin` isn't same-origin, loopback, or in
    `PI_OBS_ALLOWED_ORIGINS` are rejected with `403` (closing the drive-by from
    a site the user visits). Non-browser clients send no `Origin` and are
    unaffected; a configured token supersedes the guard. Optional shared-secret
    auth: set `PI_OBS_TOKEN` and every route requires it via an
    `Authorization: Bearer <token>` header (or a `?token=` query param for SSE
    endpoints, which use EventSource and cannot send headers); unset means the
    API is open. The pi-spawning routes (`/chat` and the LLM endpoints) are
    concurrency-capped (`PI_OBS_LLM_MAX_CONCURRENT`, default 8) and return `503`
    when saturated. Run `:id` path parameters accept the full runId or any unique
    prefix.
  version: "2.2.0"
servers:
  - url: http://127.0.0.1:7616
    description: default local obs-server (PI_OBS_PORT/--port to change)

# Applied globally: requests need the bearer token only when the server was
# started with PI_OBS_TOKEN set. With no token configured the API is open, so
# treat security as optional (either scheme — or none — satisfies it).
security:
  - bearerAuth: []
  - queryToken: []
  - {}

tags:
  - name: meta
  - name: runs
  - name: live
  - name: search
  - name: llm
    description: Optional LLM-backed endpoints — opt-in via PI_OBS_LLM=1 (the server shells out to the pi CLI; disabled returns 200 `{enabled:false,hint}`).
  - name: config
    description: Agent boot/prompt configuration.
  - name: dispatch
    description: Run a named agent standalone (no run needed) — opt-in via PI_OBS_DISPATCH=1.

paths:
  /api:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Discovery + server meta
      responses:
        "200":
          description: Server metadata and the endpoint list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }

  /api/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenApi
      summary: This spec
      responses:
        "200":
          description: The OpenAPI document (YAML).
          content:
            application/yaml:
              schema: { type: string }

  /api/summary:
    get:
      tags: [live]
      operationId: getSummary
      summary: Live rollup of the recent in-memory buffer
      responses:
        "200":
          description: Per-agent rollup of buffered (recent) events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveSummary" }

  /api/events:
    get:
      tags: [live]
      operationId: listRecentEvents
      summary: Recent events from the live buffer (oldest-first)
      parameters:
        - name: limit
          in: query
          description: Return only the newest N buffered events.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Buffered events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ObsEvent" }

  /api/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: Every run recorded in the sink (latest-first)
      parameters:
        - name: project
          in: query
          description: Filter to runs whose cwd basename equals this.
          schema: { type: string }
        - name: since
          in: query
          description: Epoch ms or an ISO date — keep runs started at/after it.
          schema: { type: string }
        - name: limit
          in: query
          description: Newest N runs.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Run summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunSummary" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: One run's summary
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: The run summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSummary" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs/{id}/events:
    get:
      tags: [runs]
      operationId: getRunEvents
      summary: The run's complete event history (from the sink archive)
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: All of the run's events, in file (≈chronological) order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ObsEvent" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs/{id}/digest:
    get:
      tags: [runs]
      operationId: getRunDigest
      summary: Anomaly digest ("what happened in this run?")
      description: >
        The digest behind `obs-cli explain`: header facts, agent timeline,
        typed anomalies (retries, truncations, tool/provider errors, slow
        tools/turns, cost outliers, compactions, context pressure), per-agent
        and per-tool rollups, and boot setup.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: format
          in: query
          description: "`text` returns a human/LLM-ready markdown rendering."
          schema: { type: string, enum: [json, text], default: json }
      responses:
        "200":
          description: The digest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDigest" }
            text/plain:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs/{id}/otel:
    get:
      tags: [runs]
      operationId: getRunOtel
      summary: The run as an OTLP/JSON trace (OpenTelemetry GenAI conventions)
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: OTLP/JSON ExportTraceServiceRequest payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resourceSpans: { type: array, items: { type: object } }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs/{id}/verdict:
    post:
      tags: [runs]
      operationId: scoreRun
      summary: Score a run (pass/fail/open)
      description: >
        Appends a verdict event to the sink (source `api`). The tailer
        broadcasts it, so open dashboards update live. The LAST verdict for a
        run wins — this overrides the workflow's auto-verdict or earlier scores.
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pass, fail, open] }
                note: { type: string, maxLength: 500 }
                agent:
                  type: string
                  maxLength: 80
                  description: Scope the verdict to one agent's run within this run (omit for the whole run).
      responses:
        "200":
          description: Verdict recorded.
          content:
            application/json:
              schema:
                type: object
                required: [ok, runId, verdict]
                properties:
                  ok: { type: boolean }
                  runId: { type: string }
                  verdict:
                    type: object
                    properties:
                      status: { type: string, enum: [pass, fail, open] }
                      note: { type: string }
                      source: { type: string, enum: [api] }
                  previous:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/RunVerdict" }]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: The verdict could not be appended to the sink.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/runs/{id}/explain:
    get:
      tags: [llm]
      operationId: explainRun
      summary: LLM narrative of a run (what happened + what to act on)
      description: >
        Opt-in (PI_OBS_LLM=1). A 2-4 sentence summary plus recommendations,
        cached per run. Disabled returns 200 `{enabled:false,hint}`; a model/
        spawn failure returns 200 `{enabled:true,error}` (not a 5xx).
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: The narrative (or a disabled/error envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LlmDisabled"
                  - $ref: "#/components/schemas/RunExplanation"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /api/runs/{id}/judge:
    get:
      tags: [llm]
      operationId: judgeRun
      summary: LLM-as-judge rubric score for a run
      description: >
        Opt-in (PI_OBS_LLM=1). Scores the run 0-100 overall on three criteria
        (goal_completion, efficiency, error_handling), cached per run. Disabled
        returns 200 `{enabled:false,hint}`; a failure returns 200
        `{enabled:true,error}`.
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: The judgement (or a disabled/error envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LlmDisabled"
                  - $ref: "#/components/schemas/RunJudgement"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /api/verdicts/backfill:
    post:
      tags: [runs]
      operationId: backfillVerdicts
      summary: Auto-score ended, still-open runs
      description: >
        Triggers the auto-verdict backfill for runs that ended without a
        verdict. Gated on PI_OBS_AUTO_VERDICT=1; disabled returns
        `{enabled:false,scored:0,hint}`.
      responses:
        "200":
          description: How many runs were scored.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, scored]
                properties:
                  enabled: { type: boolean }
                  scored: { type: integer }
                  hint: { type: string }

  /api/prompts:
    get:
      tags: [config]
      operationId: listPrompts
      summary: Versioned per-agent boot-config registry
      description: >
        Folds every run's `boot`/`session_start` snapshots into a per-agent
        history of distinct configurations (system-prompt hash + size, model,
        tools, skills, context files). Same signature ⇒ same version.
      responses:
        "200":
          description: Each agent's config versions (newest first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentPrompts" }

  /api/summarize:
    post:
      tags: [llm]
      operationId: summarizeText
      summary: One-line LLM summary of an arbitrary chunk
      description: >
        Opt-in (PI_OBS_LLM=1). Summarizes a tool's args/result for the trace
        I/O panel's AI toggle. Disabled returns 200 `{enabled:false,hint}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                kind: { type: string, maxLength: 40, default: content }
      responses:
        "200":
          description: The summary (or a disabled/error envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LlmDisabled"
                  - $ref: "#/components/schemas/TextSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /api/playground:
    post:
      tags: [llm]
      operationId: runPlayground
      summary: One-shot prompt sandbox (no tools/session/skills)
      description: >
        Opt-in (PI_OBS_LLM=1). Runs a single completion for iterating on prompt
        wording. Disabled returns 200 `{enabled:false,hint}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                system: { type: string, description: System prompt. }
                input: { type: string, description: User input. }
                model: { type: string, description: Override the configured summarizer model. }
      responses:
        "200":
          description: The completion (or a disabled/error envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LlmDisabled"
                  - $ref: "#/components/schemas/PlaygroundResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /api/agents:
    get:
      tags: [dispatch]
      operationId: listAgents
      summary: Known workflow agents (the dispatchable ones)
      description: >
        Lists the agents resolvable for dispatch — project `.pi/agents/` then the
        bundled set. `readOnly` (no write/edit tool) is informational; all agents
        are dispatchable. `dispatchEnabled` reflects PI_OBS_DISPATCH.
      parameters:
        - name: cwd
          in: query
          description: Scope project-level agents to this directory (defaults to the server cwd).
          schema: { type: string }
      responses:
        "200":
          description: The agent list.
          content:
            application/json:
              schema:
                type: object
                required: [dispatchEnabled, agents]
                properties:
                  dispatchEnabled: { type: boolean }
                  agents:
                    type: array
                    items:
                      type: object
                      required: [name, description, model, readOnly]
                      properties:
                        name: { type: string, example: seeker }
                        description: { type: string }
                        model: { type: string }
                        readOnly:
                          type: boolean
                          description: No write/edit tool. Informational — all agents are dispatchable.

  /api/select:
    post:
      tags: [dispatch]
      operationId: selectAgent
      summary: Auto-pick the best agent for a task (or "chat")
      description: >
        Opt-in (PI_OBS_LLM=1). One small LLM completion over the agent roster
        (their descriptions) picks the single best agent for a free-text task, or
        "chat" when it's a question needing no tools. Powers the bridge's /do.
        Disabled returns `{enabled:false,hint}`; a failure returns
        `{enabled:true,error}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string }
                cwd: { type: string, description: Scope the agent roster (defaults to the server cwd). }
      responses:
        "200":
          description: The routing decision (or a disabled/error envelope).
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
                  choice: { type: string, description: An agent name, or "chat". }
                  reason: { type: string }
                  model: { type: string }
                  hint: { type: string }
                  error: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /api/dispatch:
    post:
      tags: [dispatch]
      operationId: dispatchAgent
      summary: Run a single named agent standalone (SSE), no run needed
      description: >
        Opt-in (PI_OBS_DISPATCH=1). Spawns the named agent for one task — reusing
        the workflow's spawn recipe (the agent's prompt, tools, model) — and streams
        ChatEvent frames (same shape as /api/chat). The agent runs as its own root
        run, so it appears on the dashboard. The agent's FILE tools are always
        confined to `cwd` (cwd-guard); `bash` is confined too when an OS sandbox is
        configured (PI_OBS_DISPATCH_SANDBOX / _CMD, fail-closed). Disabled / bad
        input is delivered as a single `error` frame, not a non-2xx. GET with the
        same params is also accepted (EventSource transport).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, text, cwd]
              properties:
                agent: { type: string, description: Agent name or alias. }
                text: { type: string, description: The task prompt. }
                cwd: { type: string, description: Working directory; file tools are confined here. }
                model: { type: string, description: Override the agent's configured model. }
                sessionId:
                  type: string
                  description: Continue a prior dispatch (follow-ups). Must match `^[\w.-]{1,64}$`.
      responses:
        "200":
          description: SSE stream of ChatEvent frames (`data:` JSON).
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/notify:
    post:
      tags: [meta]
      operationId: relayNotify
      summary: Relay a monitor alert to a webhook
      description: >
        Server-side `POST` to an http(s) `url` (avoids browser CORS); the
        dashboard evaluates monitors client-side then posts new alerts here.
        SSRF-guarded: a host that resolves to a private/loopback/link-local
        address is refused, redirects are not followed, and an optional
        `PI_OBS_NOTIFY_HOSTS` allowlist restricts the permitted hosts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: http(s) webhook target (must resolve to a public address). }
                payload: { description: Arbitrary JSON forwarded as the POST body. }
      responses:
        "200":
          description: Relay outcome (a non-2xx from the webhook is reported as `{ok:false}`, not a 5xx).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  status: { type: integer, description: The webhook's HTTP status (on success). }
                  error: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Webhook host is not allowed — not in PI_OBS_NOTIFY_HOSTS, or it resolves to a non-public (private/loopback/link-local) address.

  /api/search:
    get:
      tags: [search]
      operationId: searchEvents
      summary: Substring search over the entire sink (every run)
      parameters:
        - name: q
          in: query
          required: true
          description: Case-insensitive substring, matched on raw event lines.
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          description: Newest N matches (default 200).
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Matching events (newest kept when over the limit).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ObsEvent" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/stream:
    get:
      tags: [live]
      operationId: streamEvents
      summary: Live event stream (Server-Sent Events)
      description: >
        `text/event-stream`: replays the current buffer, then streams live.
        Each frame is `event: obs` with an ObsEvent JSON `data:` payload;
        comment heartbeats every 15s. Consume with EventSource.
      parameters:
        - name: run
          in: query
          description: Exact runId — scopes both replay and live delivery.
          schema: { type: string }
      responses:
        "200":
          description: SSE stream of ObsEvent frames.
          content:
            text/event-stream:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Send `Authorization: Bearer <PI_OBS_TOKEN>`. Required only when the
        server was started with PI_OBS_TOKEN set.
    queryToken:
      type: apiKey
      in: query
      name: token
      description: >
        `?token=<PI_OBS_TOKEN>` query parameter — the SSE/EventSource transport,
        which cannot set an Authorization header. Equivalent to bearerAuth.

  parameters:
    RunId:
      name: id
      in: path
      required: true
      description: Full runId or a unique prefix.
      schema: { type: string }

  responses:
    NotFound:
      description: No (or no unique) run matches the id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >
        Missing or invalid token (only when the server runs with PI_OBS_TOKEN
        set). Send the bearer header, or `?token=` for SSE.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: 'Bearer realm="obs"'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ForbiddenOrigin:
      description: >
        Cross-origin browser request rejected in open (no-token) mode — the
        `Origin` isn't same-origin, loopback, or in `PI_OBS_ALLOWED_ORIGINS`.
        Can apply to any route; non-browser clients (no `Origin`) never hit it,
        and setting `PI_OBS_TOKEN` supersedes the guard.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceBusy:
      description: >
        Too many concurrent pi spawns across the LLM/chat routes (the
        `PI_OBS_LLM_MAX_CONCURRENT` cap, default 8). Retry shortly. (`/chat`
        delivers this as an SSE `error` frame instead of an HTTP 503.)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Missing or unparseable parameter / body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Meta:
      type: object
      required: [name, schema, sink, bufferedEvents, uptimeMs, endpoints]
      properties:
        name: { type: string, example: pi-agent-obs }
        schema:
          type: integer
          description: ObsEvent schema version.
          example: 2
        sink:
          type: string
          description: Path of the tailed JSONL sink.
        bufferedEvents: { type: integer }
        uptimeMs: { type: integer }
        endpoints:
          type: array
          items: { type: string }

    ObsEvent:
      type: object
      description: >
        One observability event. Events of one run interleave with other runs
        in the shared sink — always group by runId. Verdict events are
        run-level annotations (their synthetic sessions use agent "user");
        exclude them from per-agent aggregation and time bounds.
      required: [v, seq, ts, sessionId, agent, type, payload]
      properties:
        v: { type: integer, description: Schema version (2). }
        seq: { type: integer, description: Per-session monotonic sequence. }
        ts: { type: integer, description: Epoch milliseconds. }
        sessionId: { type: string, description: Unique per agent process. }
        agent: { type: string, example: orchestrator }
        cwd: { type: string, description: Project directory. }
        runId:
          type: string
          description: Groups every agent of one workflow invocation.
        parent:
          type: string
          description: Name of the dispatching agent (unset on the root).
        name:
          type: string
          description: Run display name (root session, when named).
        type:
          type: string
          enum:
            - session_start
            - boot
            - session_end
            - turn_start
            - turn_end
            - message
            - tool_start
            - tool_end
            - model_change
            - compaction
            - error
            - dispatch_start
            - dispatch_retry
            - dispatch_end
            - verdict
            - custom
        payload:
          type: object
          additionalProperties: true
          description: >
            Type-specific. Highlights — turn_end: turnIndex, tokens{input,
            output,cacheRead,cacheWrite,total}, costUsd, durationMs, tps,
            prefillMs, context{tokens,window,percent}, model, stopReason;
            tool_start/end: toolCallId, toolName, arg/argsText, durationMs,
            isError, result/resultText; boot: tools[], skills[],
            contextFiles[{path,bytes,hash}], promptChars, promptHash;
            error: source, status, message; dispatch_*: agent, dispatchId,
            reason, status, attempts; verdict: status(pass|fail|open),
            outcome?, note?, source(workflow|cli|api), prUrl?.

    RunVerdict:
      type: object
      required: [status, ts]
      properties:
        status: { type: string, enum: [pass, fail, open] }
        outcome:
          type: string
          description: Precise workflow status ("shipped", "error", …).
        note: { type: string }
        source: { type: string, enum: [workflow, cli, api] }
        ts: { type: integer, description: Epoch ms of the verdict. }

    RunSummary:
      type: object
      required: [runId, firstTs, lastTs, activeMs, events, agents, costUsd, errors, startOffset, endOffset]
      properties:
        runId: { type: string }
        firstTs: { type: integer, description: Epoch ms. }
        lastTs: { type: integer, description: Epoch ms. }
        activeMs:
          type: integer
          description: >-
            Active makespan (ms): the union of leaf turn/tool span durations —
            idle gaps and any abandoned/lingering tail removed, concurrent work
            counted once. The meaningful run latency; lastTs - firstTs over-reports
            idle time. Orchestration wrapper tools (dispatch_agent, run_agent_workflow)
            and orchestrators' blocking turns are excluded.
        events: { type: integer }
        agents:
          type: array
          items: { type: string }
        cwd: { type: string }
        name: { type: string, description: "Display name, when the run was named." }
        costUsd: { type: number }
        errors:
          type: integer
          description: Provider errors + tool errors.
        verdict: { $ref: "#/components/schemas/RunVerdict" }
        startOffset:
          type: integer
          description: Internal sink byte range — ignore.
        endOffset:
          type: integer
          description: Internal sink byte range — ignore.

    LiveSummary:
      type: object
      required: [sessions, totalEvents, totalTokens, totalCostUsd, totalErrors, agents]
      properties:
        sessions: { type: integer }
        totalEvents: { type: integer }
        totalTokens: { type: integer }
        totalCostUsd: { type: number }
        totalErrors: { type: integer }
        firstTs: { type: integer }
        lastTs: { type: integer }
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentRollup" }

    AgentRollup:
      type: object
      required: [agent, events, turns, toolCalls, toolErrors, errors, tokens, costUsd, lastType, lastTs, active]
      properties:
        agent: { type: string }
        events: { type: integer }
        turns: { type: integer }
        toolCalls: { type: integer }
        toolErrors: { type: integer }
        errors: { type: integer }
        tokens: { type: integer }
        costUsd: { type: number }
        lastType: { type: string }
        lastTs: { type: integer }
        active: { type: boolean }

    RunDigest:
      type: object
      required: [runId, startTs, endTs, wallMs, activeMs, busyMs, totals, models, agents, tools, anomalies]
      properties:
        runId: { type: string }
        name: { type: string }
        cwd: { type: string }
        startTs: { type: integer }
        endTs: { type: integer }
        wallMs: { type: integer, description: "endTs - startTs; includes idle + lingering tail." }
        activeMs:
          type: integer
          description: >-
            Active makespan (ms): union of leaf turn/tool spans (idle gaps + abandoned
            tail removed, concurrency counted once). The run's meaningful latency.
        busyMs:
          type: integer
          description: >-
            Total leaf work summed without collapsing overlap (ms). busyMs / activeMs
            is the effective parallelism; busyMs >= activeMs.
        verdict:
          type: object
          properties:
            status: { type: string, enum: [pass, fail, open] }
            outcome: { type: string }
            note: { type: string }
            source: { type: string }
        totals:
          type: object
          required: [costUsd, tokens, turns, toolCalls, toolErrors, providerErrors, retries, compactions]
          properties:
            costUsd: { type: number }
            tokens:
              type: object
              properties:
                input: { type: integer }
                output: { type: integer }
                cacheRead: { type: integer }
                cacheWrite: { type: integer }
                total: { type: integer }
            turns: { type: integer }
            toolCalls: { type: integer }
            toolErrors: { type: integer }
            providerErrors: { type: integer }
            retries: { type: integer }
            compactions: { type: integer }
        models:
          type: array
          items: { type: string }
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentDigest" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolDigest" }
        anomalies:
          type: array
          items: { $ref: "#/components/schemas/Anomaly" }

    AgentDigest:
      type: object
      required: [agent, instances, firstTs, lastTs, turns, costUsd, tokens, turnMs, toolCalls, toolErrors, errors, compactions, prefillAvgMs]
      properties:
        agent: { type: string }
        instances: { type: integer, description: Distinct sessions of this agent name. }
        firstTs: { type: integer }
        lastTs: { type: integer }
        turns: { type: integer }
        costUsd: { type: number }
        tokens: { type: integer }
        turnMs:
          type: integer
          description: Summed turn durations (excludes idle/dispatch gaps).
        toolCalls: { type: integer }
        toolErrors: { type: integer }
        errors: { type: integer }
        compactions: { type: integer }
        prefillAvgMs: { type: integer }
        maxContextPct: { type: number, nullable: true }
        model: { type: string }
        boot:
          type: object
          properties:
            tools: { type: integer }
            skills: { type: integer }
            ctxFiles: { type: integer }
            promptChars: { type: integer }

    ToolDigest:
      type: object
      required: [tool, calls, totalMs, errors]
      properties:
        tool: { type: string }
        calls: { type: integer }
        totalMs: { type: integer }
        errors: { type: integer }

    Anomaly:
      type: object
      required: [kind, detail]
      properties:
        kind:
          type: string
          enum:
            - retry
            - dispatch-error
            - truncated
            - tool-error
            - provider-error
            - slow-tool
            - slow-turn
            - cost-outlier
            - compaction
            - context
        agent: { type: string }
        detail: { type: string, description: "Human-readable, with numbers." }

    # ── LLM endpoints (opt-in PI_OBS_LLM=1) ──
    LlmDisabled:
      type: object
      description: Returned (200) by an LLM endpoint when PI_OBS_LLM is not set.
      required: [enabled, hint]
      properties:
        enabled: { type: boolean, enum: [false] }
        hint: { type: string }
    RunExplanation:
      type: object
      description: >
        On success `enabled` is true; on a best-effort model/spawn failure
        `error` is set instead of the narrative fields.
      required: [enabled]
      properties:
        enabled: { type: boolean, enum: [true] }
        narrative: { type: string }
        recommendations: { type: array, items: { type: string } }
        model: { type: string }
        ts: { type: integer }
        cached: { type: boolean }
        error: { type: string }
    JudgeCriterion:
      type: object
      required: [name, score, reason]
      properties:
        name: { type: string, example: goal_completion }
        score: { type: integer, minimum: 0, maximum: 100 }
        reason: { type: string }
    RunJudgement:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, enum: [true] }
        score: { type: integer, minimum: 0, maximum: 100, description: Overall 0-100. }
        reason: { type: string }
        criteria: { type: array, items: { $ref: "#/components/schemas/JudgeCriterion" } }
        model: { type: string }
        ts: { type: integer }
        cached: { type: boolean }
        error: { type: string }
    TextSummary:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, enum: [true] }
        summary: { type: string }
        cached: { type: boolean }
        error: { type: string }
    PlaygroundResult:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, enum: [true] }
        output: { type: string }
        model: { type: string }
        ts: { type: integer }
        error: { type: string }

    # ── Prompt-config registry ──
    PromptVersion:
      type: object
      description: One distinct boot configuration and where it was used.
      required: [promptHash, promptChars, model, tools, skills, contextFiles, firstTs, lastTs, runs, sessions]
      properties:
        promptHash: { type: string }
        promptChars: { type: integer }
        model: { type: string }
        tools: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        contextFiles: { type: array, items: { type: string } }
        firstTs: { type: integer }
        lastTs: { type: integer }
        runs: { type: array, items: { type: string }, description: Distinct runIds that used this config. }
        sessions: { type: integer, description: How many sessions booted with it. }
    AgentPrompts:
      type: object
      required: [agent, versions]
      properties:
        agent: { type: string }
        versions:
          type: array
          description: This agent's config versions, newest (by lastTs) first.
          items: { $ref: "#/components/schemas/PromptVersion" }
