name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Unit tests + syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # --workspaces=false: this job runs tsx and node --check only, so the obs/ui
      # workspace's React toolchain would be installed and never used. The
      # dashboard job below installs it.
      - run: npm ci --workspaces=false
      # The unit suite is the source of truth (see AGENTS.md). tsx erases the
      # type-only pi imports at runtime, so no pi install or type-linking is needed —
      # we run tsx directly rather than `npm test`, whose pretest hook links types
      # from a global pi install that does not exist on a runner.
      - name: Unit tests
        run: npx tsx --test utils/*/*.test.ts obs/*.test.ts
      # Parse-only check of every extension + util + obs. `node --check` does no
      # module resolution, so it needs no pi packages either. obs/ui is pruned:
      # it is the browser dashboard, whose .d.ts/ambient declarations are not
      # erasable-syntax-only and so cannot be type-stripped. It has its own job.
      - name: Syntax check
        run: find extensions utils obs -path obs/ui -prune -o -name '*.ts' -print0 | xargs -0 -n1 node --experimental-strip-types --check

  dashboard:
    name: Dashboard (obs/ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # obs/ui is an npm workspace, so its dependencies come from the ROOT install
      # and there is no obs/ui lockfile to cache against.
      - run: npm ci
      # Indentation first: it is the cheapest check and the only one that can see
      # whitespace. Everything below compiles or runs the code, so a block pasted
      # at the wrong indent passes all of them — that is how it reached review.
      - run: npm run format:check
      # It still has its own tsconfig and its own gates. The build runs last
      # because it is what obs-server actually serves.
      - run: npm run typecheck --workspace obs/ui
      - run: npm test --workspace obs/ui
      - run: npm run build --workspace obs/ui

  python:
    name: Python skill tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib-only unittest suites for the linear and atlassian skills.
      - run: python3 -m unittest discover -s skills/linear -p "test_*.py"
      - run: python3 -m unittest discover -s skills/atlassian -p "test_*.py"
