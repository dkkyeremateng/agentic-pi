<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Agent Observability — Live</title>
        <style>
            :root {
                --bg: #14141b;
                --panel: #1b1b26;
                --panel2: #22222f;
                --line: #2c2c3a;
                --fg: #c8c8d4;
                --dim: #7a7a8c;
                --accent: #7aa2f7;
                --ok: #9ece6a;
                --warn: #e0af68;
                --err: #f7768e;
                --tool: #7dcfff;
                --magenta: #bb9af7;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--fg);
                font:
                    13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas,
                    monospace;
            }
            header {
                display: flex;
                align-items: center;
                gap: 16px;
                flex-wrap: wrap;
                padding: 10px 16px;
                border-bottom: 1px solid var(--line);
                background: var(--panel);
                position: sticky;
                top: 0;
                z-index: 3;
            }
            header h1 {
                font-size: 14px;
                margin: 0;
                letter-spacing: 0.04em;
            }
            .toggle {
                display: flex;
                border: 1px solid var(--line);
                border-radius: 6px;
                overflow: hidden;
            }
            .toggle button {
                background: transparent;
                color: var(--dim);
                border: 0;
                padding: 4px 14px;
                font: inherit;
                cursor: pointer;
            }
            .toggle button.on {
                background: var(--accent);
                color: #0d0d14;
                font-weight: 600;
            }
            .stat {
                color: var(--dim);
            }
            .stat b {
                color: var(--fg);
                font-weight: 600;
            }
            #conn {
                margin-left: auto;
                color: var(--err);
            }
            #conn.up {
                color: var(--ok);
            }
            #layout {
                display: flex;
                align-items: stretch;
                min-height: calc(100vh - 44px);
            }
            #sidebar {
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 12px 8px;
                border-right: 1px solid var(--line);
                background: var(--panel);
            }
            .sbtn {
                width: 34px;
                height: 34px;
                border-radius: 7px;
                border: 1px solid var(--line);
                background: var(--panel2);
                color: var(--dim);
                font: inherit;
                font-weight: 600;
                cursor: pointer;
                position: relative;
            }
            .sbtn:hover {
                color: var(--fg);
                border-color: var(--accent);
            }
            .sbtn.on {
                color: #0d0d14;
                background: var(--accent);
                border-color: var(--accent);
            }
            .sbtn .live-dot {
                position: absolute;
                top: 3px;
                right: 3px;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--ok);
                display: none;
            }
            .sbtn.active .live-dot {
                display: block;
            }
            main {
                flex: 1;
                min-width: 0;
            }
            .view {
                display: none;
            }
            .view.on {
                display: block;
            }

            /* swimlane */
            #lanes {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
                gap: 12px;
                padding: 16px;
            }
            .lane {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            .lane.active {
                border-color: var(--accent);
            }
            .lane-head {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                background: var(--panel2);
                border-bottom: 1px solid var(--line);
                cursor: pointer;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--dim);
                flex: none;
            }
            .lane.active .dot,
            .single-dot.active {
                background: var(--ok);
                box-shadow: 0 0 6px var(--ok);
            }
            .agent {
                font-weight: 600;
            }
            .lane-meta {
                margin-left: auto;
                color: var(--dim);
                font-size: 12px;
                text-align: right;
            }
            .feed {
                padding: 6px 0;
                max-height: 340px;
                overflow-y: auto;
            }

            /* rows (shared) */
            .row {
                display: flex;
                gap: 8px;
                padding: 2px 12px;
                white-space: nowrap;
            }
            .row .t {
                color: var(--dim);
                flex: none;
            }
            .badge {
                flex: none;
                padding: 0 6px;
                border-radius: 4px;
                font-size: 11px;
                line-height: 18px;
                background: var(--panel2);
                color: var(--dim);
            }
            .badge.tool {
                color: var(--tool);
            }
            .badge.result {
                color: var(--tool);
            }
            .badge.turn {
                color: var(--accent);
            }
            .badge.err {
                color: var(--err);
            }
            .badge.sys {
                color: var(--warn);
            }
            .badge.say {
                color: var(--ok);
            }
            .badge.think {
                color: var(--magenta);
            }
            .badge.user {
                color: var(--fg);
            }
            .row .d {
                color: var(--fg);
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .badge.think ~ .d {
                color: var(--dim);
                font-style: italic;
            }
            .row.expandable {
                cursor: pointer;
            }
            .row.expandable:hover {
                background: rgba(255, 255, 255, 0.03);
            }
            .row .caret {
                color: var(--dim);
                flex: none;
                width: 10px;
            }
            .xpanel {
                position: relative;
                background: #0f0f17;
                border: 1px solid var(--line);
                border-left: 2px solid var(--accent);
                border-radius: 4px;
                margin: 2px 12px 6px;
            }
            .xpanel pre {
                margin: 0;
                padding: 10px 12px;
                max-height: 380px;
                overflow: auto;
                white-space: pre-wrap;
                word-break: break-word;
                color: var(--fg);
                font-size: 12px;
            }
            .xpanel .copy {
                position: absolute;
                top: 6px;
                right: 6px;
                background: var(--panel2);
                border: 1px solid var(--line);
                color: var(--dim);
                border-radius: 4px;
                padding: 2px 8px;
                font: inherit;
                font-size: 11px;
                cursor: pointer;
            }
            .xpanel .copy:hover {
                color: var(--fg);
                border-color: var(--accent);
            }
            .new {
                animation: flash 0.6s ease-out;
            }
            @keyframes flash {
                from {
                    background: rgba(122, 162, 247, 0.16);
                }
                to {
                    background: transparent;
                }
            }
            #empty {
                padding: 40px 18px;
                color: var(--dim);
            }

            /* single */
            #single {
                padding: 14px 18px 60px;
                position: relative;
            }
            .single-id {
                flex: none;
                display: flex;
                align-items: center;
                gap: 8px;
                margin-right: 4px;
            }
            .single-id .agent {
                font-size: 15px;
            }
            .single-id .sub {
                color: var(--dim);
            }
            #statrow {
                display: flex;
                align-items: center;
                gap: 14px;
                margin-bottom: 12px;
            }
            #ctxwidget {
                flex: none;
                display: grid;
                grid-template-columns: auto auto;
                column-gap: 16px;
                row-gap: 0;
                align-items: baseline;
                background: var(--panel2);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 6px 12px 8px;
                min-width: 210px;
            }
            #ctxwidget .ctx-label {
                grid-row: 1 / span 2;
                align-self: center;
                color: var(--dim);
                font-size: 11px;
                letter-spacing: 0.08em;
            }
            #ctxwidget .ctx-nums {
                font-size: 15px;
                font-weight: 600;
                color: var(--fg);
            }
            #ctxwidget .ctx-rem {
                color: var(--dim);
                font-size: 12px;
                text-align: right;
            }
            #ctxwidget .ctx-rem b {
                color: var(--fg);
                font-weight: 600;
            }
            #ctxwidget .ctx-bar {
                grid-column: 1 / span 2;
                height: 3px;
                margin-top: 6px;
                background: var(--line);
                border-radius: 2px;
                overflow: hidden;
            }
            #ctxwidget .ctx-bar #ctx-fill {
                height: 100%;
                width: 0%;
                background: var(--ok);
                transition: width 0.3s ease;
            }
            #filters {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                margin-bottom: 10px;
            }
            #search {
                background: var(--panel2);
                border: 1px solid var(--line);
                color: var(--fg);
                border-radius: 6px;
                padding: 4px 10px;
                font: inherit;
                width: 220px;
            }
            .chip {
                border: 1px solid var(--line);
                background: var(--panel);
                color: var(--dim);
                border-radius: 999px;
                padding: 2px 10px;
                font-size: 12px;
                cursor: pointer;
            }
            .chip.on {
                color: var(--fg);
                border-color: var(--accent);
                background: rgba(122, 162, 247, 0.12);
            }
            .chip.act {
                color: var(--accent);
            }
            #statbar {
                flex: 1;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .pill {
                background: var(--panel2);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 3px 9px;
                color: var(--dim);
            }
            .pill b {
                color: var(--fg);
                font-weight: 600;
            }
            .pill.cost b {
                color: var(--ok);
            }
            #single-feed .row {
                white-space: normal;
                border-bottom: 1px solid rgba(44, 44, 58, 0.5);
                padding: 4px 6px;
            }
            #single-feed .row .d {
                white-space: pre-wrap;
                word-break: break-word;
            }
            #resume {
                position: fixed;
                bottom: 16px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--accent);
                color: #0d0d14;
                border: 0;
                border-radius: 999px;
                padding: 6px 16px;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
                display: none;
                z-index: 4;
            }
            #resume.show {
                display: block;
            }
            #single-empty {
                color: var(--dim);
                padding: 30px 4px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>AGENT OBSERVABILITY</h1>
            <div class="toggle">
                <button id="v-swimlane" class="on">Swimlane</button>
                <button id="v-single">Single</button>
            </div>
            <span class="stat">agents <b id="s-agents">0</b></span>
            <span class="stat">events <b id="s-events">0</b></span>
            <span class="stat">tokens <b id="s-tokens">0</b></span>
            <span class="stat">cost <b id="s-cost">$0.00</b></span>
            <span class="stat">tok/s <b id="s-tps">0</b></span>
            <span class="stat">errors <b id="s-errors">0</b></span>
            <span class="stat">elapsed <b id="s-elapsed">0s</b></span>
            <span id="conn">connecting…</span>
        </header>
        <div id="layout">
            <aside id="sidebar"></aside>
            <main>
                <section id="swimlane" class="view on">
                    <div id="empty">
                        Waiting for events… run a workflow with
                        <b>PI_OBS=1</b> in this project.
                    </div>
                    <div id="lanes"></div>
                </section>
                <section id="single" class="view">
                    <div id="filters">
                        <input id="search" placeholder="search…" />
                        <span id="chips"></span>
                    </div>
                    <div id="statrow">
                        <span class="single-id">
                            <span class="single-dot dot"></span>
                            <span class="agent" id="single-agent">—</span>
                            <span class="sub" id="single-sub"></span>
                        </span>
                        <div id="statbar"></div>
                        <div id="ctxwidget">
                            <span class="ctx-label">CONTEXT</span>
                            <span class="ctx-nums"
                                ><b id="ctx-used">—</b> /
                                <span id="ctx-win">—</span></span
                            >
                            <span class="ctx-rem"
                                ><b id="ctx-pct">—</b> remaining</span
                            >
                            <div class="ctx-bar">
                                <div id="ctx-fill"></div>
                            </div>
                        </div>
                    </div>
                    <div id="single-empty">
                        Pick an agent on the left to inspect its full timeline.
                    </div>
                    <div id="single-feed"></div>
                    <button id="resume">↓ paused — click to resume live</button>
                </section>
            </main>
        </div>
        <script src="/app.js"></script>
    </body>
</html>
